<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- URL の合言葉を、ほかのサイトへ渡さない -->
  <meta name="referrer" content="no-referrer">
  <title>写真を送る</title>
  <link rel="stylesheet" href="../shared/webapp.css">
  <script src="../shared/webapp.js"></script>
</head>
<body>
  <!-- 05 現場の写真と書類：写真を送る画面（1-20 の試作）。処理は GAS の photo（05_site-photos/src/photo.js）。 -->
  <main>
    <h1>写真を送る</h1>
    <label for="who">あなたの名前</label>
    <input id="who" autocomplete="name" placeholder="大川">
    <label for="site">現場</label>
    <select id="site"><option value="">読んでいます…</option></select>
    <label for="file">写真</label>
    <input id="file" type="file" accept="image/*">
    <p class="note">写真は長い辺を 1600 ピクセルに縮めて送ります。</p>
    <button id="send">送る</button>
    <p id="out" class="msg" hidden></p>
  </main>
  <script>
    (function () {
      const site = document.getElementById('site');
      const btn = document.getElementById('send');
      if (!WebApp.ready()) return;
      WebApp.remember('who');

      WebApp.call('photo', 'sites').then(function (list) {
        site.innerHTML = '';
        site.add(new Option('選んでください', ''));
        list.forEach(function (s) { site.add(new Option(s.id + ' ' + s.name, s.id)); });
      }).catch(function (e) {
        site.innerHTML = '';
        site.add(new Option('読めませんでした', ''));
        WebApp.show(e.message, true);
      });

      btn.addEventListener('click', function () {
        const file = document.getElementById('file').files[0];
        const who = document.getElementById('who').value.trim();
        if (!who || !site.value || !file) {
          WebApp.show('名前・現場・写真を選んでください', true);
          return;
        }
        btn.disabled = true;
        WebApp.show('送っています…');
        const started = Date.now();
        WebApp.shrinkImage(file, 1600).then(function (data) {
          return WebApp.call('photo', 'upload', { siteId: site.value, who: who, name: file.name, data: data });
        }).then(function (r) {
          WebApp.show(r.message + '（' + Math.round((Date.now() - started) / 100) / 10 + '秒）');
          document.getElementById('file').value = '';
        }).catch(function (e) {
          WebApp.show(e.message, true);
        }).then(function () {
          btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
