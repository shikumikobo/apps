<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- URL の合言葉を、ほかのサイトへ渡さない -->
  <meta name="referrer" content="no-referrer">
  <title>送った写真</title>
  <link rel="stylesheet" href="../shared/webapp.css">
  <script src="../shared/webapp.js"></script>
  <style>
    h2 { font-size: 17px; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #c9cec3; }
    h2 small { font-weight: normal; color: #5d6458; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    figure { margin: 0; background: #fff; border: 1px solid #c9cec3; border-radius: 10px; overflow: hidden; }
    figure.on { border: 3px solid #4f8a3a; }
    figure img, figure .noimg { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #e4e7df; }
    figure .noimg { display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; color: #5d6458; }
    figcaption { padding: 6px 8px; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    figcaption b { display: inline-block; font-size: 13px; padding: 0 6px; border-radius: 6px; background: #e7f1e1; margin-right: 4px; }
    figcaption .memo { display: block; color: #22261f; margin-top: 2px; }
    .pick { display: flex; align-items: center; gap: 6px; margin: 0; padding: 6px 8px; font-size: 14px; font-weight: normal; border-top: 1px solid #e4e7df; }
    .pick input { width: 20px; height: 20px; margin: 0; padding: 0; }
    #count { margin-top: 12px; }
  </style>
</head>
<body>
  <!-- 05 現場の写真と書類：送った写真を見る画面。処理は GAS の photo の list・mark（05_site-photos/src/photo.js）。
       作業日ごとに見出しを付けて並べる。「レポートに使う」の印は、台帳の「写真」の同じ名前の列に入る。
       写真を送る画面は photo.html（現場を選んだまま行き来する）。 -->
  <main>
    <div class="nav"><h1>送った写真</h1><a id="toSend" href="#">写真を送る</a></div>
    <label for="site">現場</label>
    <select id="site"><option value="">読んでいます…</option></select>
    <p id="count" class="note" hidden></p>
    <div id="list"></div>
    <button id="more" hidden>もっと見る</button>
    <p id="out" class="msg" hidden></p>
  </main>
  <script>
    (function () {
      const site = document.getElementById('site');
      const list = document.getElementById('list');
      const more = document.getElementById('more');
      const count = document.getElementById('count');
      const toSend = document.getElementById('toSend');
      let shown = 0;
      let loading = 0; // 現場を選び直したら、前の読み込みの結果は捨てる
      let lastDay = ''; // 前に出した写真の作業日（同じ日なら同じ見出しの下に続ける）
      let grid = null;
      if (!WebApp.ready()) return;

      function updateLink() {
        toSend.href = WebApp.link('photo.html', { site: site.value });
      }

      // 送る画面から来たときは、現場の一覧を待たずに、その現場の写真を読み始める（1回の呼び出しに数秒かかるため）
      const want = WebApp.param('site');
      if (want) {
        site.innerHTML = '';
        site.add(new Option(want, want));
        site.value = want;
        reload();
        updateLink();
      }
      WebApp.call('photo', 'sites').then(function (r) {
        site.innerHTML = '';
        site.add(new Option('選んでください', ''));
        r.sites.forEach(function (s) { site.add(new Option(s.id + ' ' + s.name + (s.periodic ? '（定期）' : ''), s.id)); });
        if (want && r.sites.some(function (s) { return s.id === want; })) site.value = want;
        updateLink();
      }).catch(function (e) {
        site.innerHTML = '';
        site.add(new Option('読めませんでした', ''));
        WebApp.show(e.message, true);
      });

      site.addEventListener('change', function () {
        updateLink();
        reload();
      });
      more.addEventListener('click', function () { load(loading); });

      function reload() {
        loading++;
        shown = 0;
        lastDay = '';
        grid = null;
        list.innerHTML = '';
        count.hidden = true;
        more.hidden = true;
        document.getElementById('out').hidden = true;
        if (site.value) load(loading);
      }

      function load(ticket) {
        more.disabled = true;
        WebApp.show('読んでいます…');
        WebApp.call('photo', 'list', { siteId: site.value, offset: shown }).then(function (r) {
          if (ticket !== loading) return;
          r.items.forEach(function (it) {
            if (it.workDate !== lastDay) {
              const h = document.createElement('h2');
              h.textContent = it.workDate + ' ';
              if (it.round) {
                const small = document.createElement('small');
                small.textContent = it.round;
                h.appendChild(small);
              }
              list.appendChild(h);
              grid = document.createElement('div');
              grid.className = 'grid';
              list.appendChild(grid);
              lastDay = it.workDate;
            }
            grid.appendChild(card(it));
          });
          shown += r.items.length;
          count.textContent = r.site.id + ' ' + r.site.name + '：' + r.total + '枚（作業日の新しい順。' + shown + '枚を出しています）。' +
            'レポートに使う写真に印を付けると、レポートには印の写真だけが入ります';
          count.hidden = false;
          more.hidden = shown >= r.total;
          more.disabled = false;
          if (r.total) document.getElementById('out').hidden = true;
          else WebApp.show('この現場には、まだ写真がありません');
        }).catch(function (e) {
          if (ticket !== loading) return;
          more.disabled = false;
          WebApp.show(e.message, true);
        });
      }

      function card(it) {
        const fig = document.createElement('figure');
        if (it.thumb) {
          const img = document.createElement('img');
          img.alt = it.original || it.fileName;
          img.src = 'data:image/jpeg;base64,' + it.thumb;
          fig.appendChild(img);
        } else {
          const none = document.createElement('div');
          none.className = 'noimg';
          none.textContent = it.pdf ? 'PDF' : '小さい画像なし';
          fig.appendChild(none);
        }
        const cap = document.createElement('figcaption');
        const cat = document.createElement('b');
        cat.textContent = it.category;
        cap.appendChild(cat);
        cap.appendChild(document.createTextNode(it.who + '・' + (it.original || it.fileName)));
        if (it.memo) {
          const memo = document.createElement('span');
          memo.className = 'memo';
          memo.textContent = it.memo;
          cap.appendChild(memo);
        }
        fig.appendChild(cap);
        if (!it.pdf) fig.appendChild(pick(it, fig));
        return fig;
      }

      /** 「レポートに使う」の印。押したらすぐ台帳に書く（書けなければ元に戻す）。 */
      function pick(it, fig) {
        const label = document.createElement('label');
        label.className = 'pick';
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = it.report;
        fig.classList.toggle('on', it.report);
        box.addEventListener('change', function () {
          const want = box.checked;
          box.disabled = true;
          WebApp.call('photo', 'mark', { photoId: it.id, report: want }).then(function (r) {
            box.checked = r.report;
            fig.classList.toggle('on', r.report);
          }).catch(function (e) {
            box.checked = !want;
            WebApp.show(e.message, true);
          }).then(function () { box.disabled = false; });
        });
        label.appendChild(box);
        label.appendChild(document.createTextNode('レポートに使う'));
        return label;
      }
    })();
  </script>
</body>
</html>
